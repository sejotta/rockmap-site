<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Esta parte no está publicada — RockMap</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f2e9;
        --card: #fffdf8;
        --ink: #3a2f28;
        --muted: #6f6459;
        --line: #e2d9c9;
        --primary: #96462a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171412;
          --card: #211c19;
          --ink: #efe8de;
          --muted: #a99c8d;
          --line: #342c26;
          --primary: #d98a5f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-color: var(--bg);
        background-image:
          radial-gradient(78rem 46rem at 10% -8%, rgba(150, 70, 42, 0.22), transparent 62%),
          radial-gradient(66rem 40rem at 98% -6%, rgba(107, 122, 82, 0.16), transparent 60%);
        background-repeat: no-repeat;
        color: var(--ink);
        font:
          15px/1.65 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 34rem;
        padding: 2.5rem;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
      }
      .kicker {
        margin: 0 0 0.75rem;
        font:
          500 11px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: 2rem;
        line-height: 1.15;
        font-weight: 500;
        letter-spacing: -0.018em;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.75rem;
      }
      a {
        padding: 0.6rem 1.15rem;
        border-radius: 999px;
        font-size: 14px;
        text-decoration: none;
        border: 1px solid transparent;
      }
      a.primary {
        background: var(--primary);
        color: #fffdf8;
      }
      a.secondary {
        border-color: var(--line);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="kicker">RockMap · 404</p>
      <h1>Esta parte todavía no está publicada</h1>
      <p>
        Aquí solo vive la web pública de RockMap. El planificador —tu cuenta, el itinerario, el mapa
        y el presupuesto— necesita un servidor y de momento se ejecuta en local.
      </p>
      <div class="actions">
        <a class="primary" href="/rockmap-site/">Volver al inicio</a>
        <a class="secondary" href="/rockmap-site/#como-funciona">Cómo funciona</a>
      </div>
    </main>
  </body>
</html>
